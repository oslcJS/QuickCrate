name: QuickCrates
version: 1.0.0
main: com.quickcrates.QuickCrates
api-version: '1.20'
author: QuickCrates
description: Free crate plugin with weighted rewards, animations, virtual & physical keys, preview GUI.
softdepend: [PlaceholderAPI, Vault, QuickEco]
folia-supported: false

commands:
  quickcrates:
    description: Main QuickCrates command
    aliases: [qc, crates]
    usage: /qc help
  crate:
    description: Crate management
    aliases: [crate]
  key:
    description: Key management
    aliases: [keys]
  cratewand:
    description: Get the Crate Wand to link blocks to crates
    usage: /cratewand
    permission: quickcrates.admin

permissions:
  quickcrates.*:
    description: All QuickCrates permissions
    default: op
    children:
      quickcrates.admin: true
      quickcrates.use: true
      quickcrates.preview: true
  quickcrates.admin:
    description: Admin commands (give keys, reload, create crates)
    default: op
  quickcrates.use:
    description: Use crates
    default: true
  quickcrates.preview:
    description: Preview crate contents
    default: true
