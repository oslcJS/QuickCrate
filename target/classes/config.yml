# QuickCrates main config
settings:
  # If true, players can hold a key in offhand and right-click crate to open
  offhand-open: true
  # Broadcast a message when a player wins a reward marked broadcast: true
  broadcast-rare: true
  # Sound played when crate opens
  open-sound: BLOCK_ENDER_CHEST_OPEN
  # Sound played when crate finishes (winner picked)
  win-sound: ENTITY_PLAYER_LEVELUP
  # Default animation if a crate doesn't specify one
  default-animation: SPIN
  # Cooldown between opens by same player on same crate (seconds)
  open-cooldown: 1
  # Particle effect when reward chosen (NONE to disable)
  reward-particle: HAPPY_VILLAGER

storage:
  # yaml | sqlite (sqlite uses internal player virtual-key table)
  type: yaml

# Template used by /qc addcrate <name> when generating a new crate YAML.
# {name} is replaced with the crate name. Edit these so new crates inherit
# your preferred defaults right out of the gate.
crate-defaults:
  display-name: "&6&l{name} Crate"
  key:
    material: TRIPWIRE_HOOK
    name: "&6&l{name} Key"
    glow: true
  # Animation: SPIN | CSGO | ROULETTE | QUICK | FIREWORK
  animation: CSGO
  preview-gui:
    rows: 3

# Floating label display above linked crate blocks
display:
  # Height above the block (blocks)
  height: 1.8
  # Text scale (1.0 = normal)
  scale: 1.4
  # See-through walls (true = visible through walls)
  see-through: false
  # Text shadow
  shadow: true
  # Background transparency (0 = fully transparent, 255 = solid)
  background-alpha: 0
  # Billboard mode: CENTER | FIXED | VERTICAL | HORIZONTAL
  billboard: CENTER

# QuickEco integration — direct money rewards from crates
quickeco:
  enabled: true
  # Format shown in preview GUI when QuickEco is linked
  money-prefix: "&6&l$"

messages:
  prefix: "&6[QuickCrates] &r"
  no-permission: "&cYou don't have permission for that."
  no-key: "&cYou don't have a key for this crate!"
  inventory-full: "&cYour inventory is full!"
  win: "&aYou won &e{reward} &afrom &6{crate}&a!"
  win-money: "&aYou won &e{money} &afrom &6{crate}&a!"
  broadcast: "&e{player} &7won &e{reward} &7from &6{crate}&7!"
  broadcast-money: "&e{player} &7won &e{money} &7from &6{crate}&7!"
  reload: "&aQuickCrates reloaded."
  preview-title: "&8Preview: {crate}"
