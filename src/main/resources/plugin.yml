name: QuickCrates
version: ${project.version}
main: com.quickcrates.QuickCrates
api-version: '1.20'
author: QuickCrates
description: Free crate plugin with weighted rewards, animations, virtual & physical keys, preview GUI.
softdepend: [PlaceholderAPI, Vault, QuickEco]
folia-supported: false

commands:
  quickcrates:
    description: QuickCrates admin root command
    aliases: [qc, crates]
    usage: /qc help
  keys:
    description: Show your keys
    aliases: [mykeys]
    permission: quickcrates.use
    usage: /keys

permissions:
  quickcrates.admin:
    description: Grants every QuickCrates admin permission below
    default: op
    children:
      quickcrates.reload: true
      quickcrates.crate.edit: true
      quickcrates.wand: true
      quickcrates.key.give: true
      quickcrates.keyall: true
      quickcrates.preview: true
      quickcrates.use: true
  quickcrates.reload:
    description: Reload config and crates
    default: op
  quickcrates.crate.edit:
    description: Create, remove, and list crates
    default: op
  quickcrates.wand:
    description: Receive the crate wand
    default: op
  quickcrates.key.give:
    description: Give physical or virtual keys to a player
    default: op
  quickcrates.keyall:
    description: Distribute keys to every online player
    default: op
  quickcrates.preview:
    description: Preview crate rewards
    default: true
  quickcrates.use:
    description: Use crates and check your own keys
    default: true
